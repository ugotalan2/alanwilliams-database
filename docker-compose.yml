services:
  postgres:
    image: postgres:17
    container_name: alanwilliams-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - /opt/alanwilliams/postgres/data:/var/lib/postgresql/data
      - /opt/alanwilliams/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "pg_isready -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      alanwilliams-backend:
        aliases:
          - postgres

networks:
  alanwilliams-backend:
    external: true
