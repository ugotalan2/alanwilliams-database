services:
  postgres:
    image: postgres:17
    container_name: alanwilliams-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - alanwilliams-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      alanwilliams-backend:
        aliases:
          - postgres

volumes:
  alanwilliams-postgres-data:
    name: alanwilliams-postgres-data

networks:
  alanwilliams-backend:
    name: alanwilliams-backend
